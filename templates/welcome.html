<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أهلا بحضرتك</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            width: 90%;
            max-width: 450px;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.07);
            text-align: center;
            border-top: 5px solid #6fb7e8;
        }
        h1 {
            color: #3a3a3a;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #7a7a7a;
            margin-bottom: 35px;
            font-size: 16px;
        }
        .role-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            padding: 14px 20px;
            font-size: 17px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
        }
        .btn-teacher {
            background-color: #6fb7e8;
            color: white;
        }
        .btn-teacher:hover {
            background-color: #5aa5d6;
        }
        .btn-student {
            background-color: #e9ecef;
            color: #495057;
            border: 1px solid #dee2e6;
        }
        .btn-student:hover {
            background-color: #dde2e6;
        }
        .footer-text {
            margin-top: 25px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>أهلا بحضرتك</h1>
        <p class="subtitle">اختر طريقة الدخول المناسبة لحضرتك</p>
        
        <form method="POST" class="role-form">
            {% csrf_token %}
            <button type="submit" name="role" value="teacher" class="btn btn-teacher">دخول كمدرس</button>
            <button type="submit" name="role" value="student" class="btn btn-student">دخول كطالب</button>
        </form>

        <p class="footer-text">منصة متابعة بسيطة </p>
    </div>
</body>
</html>
