<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تأكيد الحذف</title>
    <style>
        body{margin:0;font-family:'Segoe UI',sans-serif;background:#f5f7f9;display:flex;justify-content:center;align-items:center;min-height:100vh}
        .card{background:#fff;width:90%;max-width:400px;padding:30px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.07);text-align:center;border-top:5px solid #e9a0a0}
        .btn{padding:12px 20px;font-size:15px;border:none;border-radius:10px;cursor:pointer;font-weight:600;margin:5px}
        .btn-delete{background:#ffe3e3;color:#c92a2a}
        .btn-cancel{background:#e9ecef;color:#495057;text-decoration:none;display:inline-block}
    </style>
</head>
<body>
    <div class="card">
        <h2>هل حضرتك متأكد من حذف {{ student.name }}؟</h2>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-delete">نعم، احذف</button>
            <a href="{% url 'dashboard' %}" class="btn btn-cancel">إلغاء</a>
        </form>
    </div>
</body>
</html>
