<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل مدرس جديد</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.07);
            border-top: 5px solid #6fb7e8;
        }
        h1 {
            text-align: center;
            color: #3a3a3a;
            margin-bottom: 25px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 14px;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dde2e6;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
            background-color: #fafbfc;
        }
        input:focus {
            outline: none;
            border-color: #6fb7e8;
            background-color: #fff;
        }
        .row {
            display: flex;
            gap: 12px;
        }
        .row .form-group {
            flex: 1;
        }
        .btn {
            width: 100%;
            padding: 14px;
            font-size: 17px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background-color: #6fb7e8;
            color: white;
            font-weight: 600;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn:hover {
            background-color: #5aa5d6;
        }
        .error {
            background-color: #ffeaea;
            color: #d33;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
        }
        .link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        .link a {
            color: #6fb7e8;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>تسجيل حساب حضرتك كمدرس</h1>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="row">
                <div class="form-group">
                    <label>الاسم الأول</label>
                    <input type="text" name="first_name" required>
                </div>
                <div class="form-group">
                    <label>الاسم الأخير</label>
                    <input type="text" name="last_name" required>
                </div>
            </div>

            <div class="form-group">
                <label>المادة</label>
                <input type="text" name="subject" required>
            </div>

            <div class="form-group">
                <label>رقم الهاتف</label>
                <input type="text" name="phone" required>
            </div>

            <div class="form-group">
                <label>كلمة السر</label>
                <input type="password" name="password" required>
            </div>

            <div class="form-group">
                <label>كود التفعيل</label>
                <input type="text" name="code_input" required>
            </div>

            <button type="submit" class="btn">تسجيل</button>
        </form>

        <div class="link">
            <a href="{% url 'teacher_login' %}">عندك حساب بالفعل؟ سجل دخول</a>
        </div>
    </div>
</body>
</html>
